# Rise of Davraz - test APK'sını GitHub Actions'ta ücretsiz derler (GameCI). Google Play paketi (.aab): google-play.yml
#
# Depo herkese açık olduğu için GitHub'ın standart makinelerinde derleme dakikaları ücretsizdir.
# Kendiliğinden çalışmaz: GitHub'da Actions > "Android APK (ücretsiz)" > "Run workflow" ile başlatılır.
#
# Bir kez yapılacak ayar (BU depoda: Settings > Secrets and variables > Actions > New repository secret):
#   UNITY_LICENSE   Unity Hub'ın oluşturduğu Unity_lic.ulf dosyasının tam içeriği (<?xml ... ile başlar)
#   UNITY_EMAIL     Unity hesabının e-postası
#   UNITY_PASSWORD  Unity hesabının şifresi (hesapta iki adımlı doğrulama kapalı olmalı)
# Gizli ayarlar depoya özeldir; Ötüken Destanı deposundakiler buraya otomatik gelmez.
#
# Çıktı:
#   - "son-apk" adlı ön sürümde RiseOfDavraz.apk (telefondan doğrudan indirilir, her derlemede yenilenir)
#     https://github.com/<sahip>/<depo>/releases/download/son-apk/RiseOfDavraz.apk
#   - aynı APK, çalıştırma sayfasında 5 gün saklanan bir zip olarak
#   - "son-server" ön sürümünde ZootopiaServer.tar.gz: çevrimiçi oyun sunucusu (Linux). Kiralık sunucudaki
#     maç yöneticisi (Server/orchestrator.py) bunu birkaç dakika içinde kendisi indirip kullanır.
#     İkisine aynı "çevrimiçi sürüm" gömülür (Tools~/net_version.sh: yalnız ağ kodu, harita ve dünya değişince
#     değişir). Telefonunki sunucununkiyle aynı değilse telefon "güncelle" der.
#
# İmza: Tools~/android/gelistirme.keystore (şifresi Android'in standart test şifresi "android").
# Her derleme aynı anahtarla imzalandığı için yeni APK eskisinin üstüne kurulur, kayıtlar silinmez.
# Bu anahtar YALNIZCA test içindir; Google Play'e yüklenecek sürüm ayrı ve gizli bir anahtarla imzalanacak.

name: Android APK (ücretsiz)

on:
  workflow_dispatch:
    inputs:
      temiz_derleme:
        description: 'Önbelleği kullanmadan sıfırdan derle (garip bir hata olursa işaretle)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  APK_ADI: RiseOfDavraz
  SURUM_ETIKETI: son-apk

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Unity lisansı ayarlı mı?
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          eksik=""
          [ -n "$UNITY_LICENSE" ] || eksik="$eksik UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || eksik="$eksik UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || eksik="$eksik UNITY_PASSWORD"
          if [ -n "$eksik" ]; then
            echo "::error title=Unity lisansı eksik::Şu gizli anahtarlar yok:$eksik. Bu depoda Settings > Secrets and variables > Actions > New repository secret ile ekle."
            exit 1
          fi
          case "$UNITY_LICENSE" in
            *DeveloperData*) echo "Lisans dosyası tamam." ;;
            *) echo "::error title=Lisans dosyası hatalı::UNITY_LICENSE, Unity_lic.ulf dosyasının TAM içeriği olmalı (<?xml ile başlar, içinde DeveloperData geçer)."
               exit 1 ;;
          esac

      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Kodu indir
        uses: actions/checkout@v7

      - name: Unity önbelleği (Library)
        if: ${{ !inputs.temiz_derleme }}
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-2022.3.62f3-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-2022.3.62f3-

      - name: Çevrimiçi sürüm damgası (telefon ile sunucu aynı olmalı)
        run: |
          mkdir -p Assets/Resources
          echo "net-$(bash 'Tools~/net_version.sh')" > Assets/Resources/zm_version.txt
          echo "Çevrimiçi sürüm: $(cat Assets/Resources/zm_version.txt)"

      - name: Sürüm numarası ve imza anahtarı
        id: hazirlik
        run: |
          echo "surum=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "kod=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "anahtar=$(base64 -w0 'Tools~/android/gelistirme.keystore')" >> "$GITHUB_OUTPUT"

      - name: Unity ile Android APK derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: ${{ env.APK_ADI }}
          # Sahneyi oluşturur, paket adını/IL2CPP/ARM64/yatay ekranı ayarlar ve APK'yı derler.
          buildMethod: ZootopiaBuild.BuildAndroid
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel36
          versioning: Custom
          version: ${{ steps.hazirlik.outputs.surum }}
          androidVersionCode: ${{ steps.hazirlik.outputs.kod }}
          androidKeystoreName: gelistirme.keystore
          androidKeystoreBase64: ${{ steps.hazirlik.outputs.anahtar }}
          androidKeystorePass: android
          androidKeyaliasName: androiddebugkey
          androidKeyaliasPass: android

      - name: Derleme hatalarını göster
        if: always()
        run: |
          f=build/zm_build_errors.txt
          if [ -f "$f" ]; then
            msg=$(head -c 6000 "$f" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Unity derleme hataları::${msg}"
          else
            echo "::warning title=Unity derleme hataları::Derleme metodu hiç çalışmadı (büyük ihtimalle C# derleme hatası)."
          fi

      - name: APK'yı bul
        id: apk
        run: |
          apk=$(find build/Android -maxdepth 2 -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error title=APK yok::Derleme bitti ama APK dosyası bulunamadı."
            exit 1
          fi
          boyut=$(stat -c %s "$apk")
          echo "yol=$apk" >> "$GITHUB_OUTPUT"
          echo "boyut_mb=$((boyut / 1048576))" >> "$GITHUB_OUTPUT"
          echo "APK: $apk ($((boyut / 1048576)) MB)"

      - name: APK'yı çalıştırma sayfasına ekle (5 gün)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ADI }}-${{ steps.hazirlik.outputs.surum }}
          path: ${{ steps.apk.outputs.yol }}
          retention-days: 5
          compression-level: 0

      - name: Telefondan indirme bağlantısını yenile
        if: ${{ steps.apk.outputs.boyut_mb < 2000 }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_YOLU: ${{ steps.apk.outputs.yol }}
          SURUM: ${{ steps.hazirlik.outputs.surum }}
        run: |
          cp "$APK_YOLU" "${APK_ADI}.apk"
          gh release delete "$SURUM_ETIKETI" --yes --cleanup-tag || true
          gh release create "$SURUM_ETIKETI" "${APK_ADI}.apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rise of Davraz - son test sürümü ($SURUM)" \
            --notes "Test sürümü $SURUM, $(date -u +'%d.%m.%Y %H:%M') UTC. Commit: ${GITHUB_SHA::8}. Telefona indirip kurun; eski test sürümünün üstüne kurulur."
          link="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SURUM_ETIKETI}/${APK_ADI}.apk"
          {
            echo "## Rise of Davraz $SURUM hazır"
            echo ""
            echo "Telefondan indir: $link"
            echo ""
            echo "Boyut: ${{ steps.apk.outputs.boyut_mb }} MB"
          } >> "$GITHUB_STEP_SUMMARY"

  # Online game server: the same game as a headless Linux program (Mono), published as "son-server".
  server:
    name: Linux oyun sunucusu
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Unity lisansı ayarlı mı?
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error title=Unity lisansı eksik::UNITY_LICENSE, UNITY_EMAIL ve UNITY_PASSWORD gizli anahtarları gerekli."
            exit 1
          fi

      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Kodu indir
        uses: actions/checkout@v7

      - name: Unity önbelleği (Library, Linux)
        if: ${{ !inputs.temiz_derleme }}
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Linux-2022.3.62f3-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-2022.3.62f3-

      - name: Çevrimiçi sürüm damgası (telefon ile sunucu aynı olmalı)
        run: |
          mkdir -p Assets/Resources
          echo "net-$(bash 'Tools~/net_version.sh')" > Assets/Resources/zm_version.txt
          echo "Çevrimiçi sürüm: $(cat Assets/Resources/zm_version.txt)"

      - name: Unity ile Linux sunucusu derle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: ZootopiaServer
          buildMethod: ZootopiaBuild.BuildServer
          versioning: Custom
          version: 0.1.${{ github.run_number }}

      - name: Derleme hatalarını göster
        if: always()
        run: |
          f=build/zm_build_errors.txt
          if [ -f "$f" ]; then
            msg=$(head -c 6000 "$f" | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Sunucu derleme hataları::${msg}"
          else
            echo "::warning title=Sunucu derleme hataları::Derleme metodu hiç çalışmadı (büyük ihtimalle C# derleme hatası)."
          fi

      - name: Sunucu paketini hazırla
        run: |
          exe=$(find build -name '*.x86_64' -type f | head -n 1)
          if [ -z "$exe" ]; then
            echo "::error title=Sunucu yok::Derleme bitti ama sunucu programı (.x86_64) bulunamadı."
            exit 1
          fi
          mkdir -p paket
          cp -r "$(dirname "$exe")"/. paket/
          cp Assets/Resources/zm_version.txt paket/VERSION
          tar -czf ZootopiaServer.tar.gz -C paket .
          echo "Sunucu paketi: $(du -h ZootopiaServer.tar.gz | cut -f1)"

      - name: Sunucunun indireceği sürümü yenile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-server --yes --cleanup-tag || true
          gh release create son-server ZootopiaServer.tar.gz \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Rise of Davraz - oyun sunucusu (${GITHUB_SHA::8})" \
            --notes "Çevrimiçi oyun sunucusu, commit ${GITHUB_SHA::8}. Kiralık sunucu bunu kendisi indirir; elle bir şey yapmaya gerek yok."
          echo "## Oyun sunucusu ${GITHUB_SHA::8} yayınlandı" >> "$GITHUB_STEP_SUMMARY"

  # When a build fails, publish the Unity errors as a release ("build-log") so they can be read
  # without opening the Actions page (errors.txt = matching lines, tail.txt = end of the log).
  hata-kaydi:
    needs: [android, server]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Derleme hatalarını yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for jid in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            code=$(curl -sS -L -o "job_$jid.log" -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$jid/logs")
            echo "::notice title=Log $jid::http $code, $(wc -c < "job_$jid.log") bytes"
            # Unity compile errors, package errors and the build result: one annotation per job (multi-line)
            grep -E "error CS[0-9]+|Shader error|[Ee]rror:|Exception|BuildFailed|Build Finished|ERROR|[Ff]ailed|Cannot|Unable|package|Package" "job_$jid.log" \
              | grep -v -i "node.js\|deprecat" | sed 's/^[0-9TZ:.-]* //' | cut -c1-240 | awk '!seen[$0]++' | tail -45 > "err_$jid.txt"
            msg=$(sed 's/%/%25/g' "err_$jid.txt" | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Unity hataları ($jid)::${msg:-(eşleşen satır yok)}"
            msg2=$(tail -60 "job_$jid.log" | sed 's/^[0-9TZ:.-]* //' | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=Log sonu ($jid)::${msg2}"
          done
          exit 0
