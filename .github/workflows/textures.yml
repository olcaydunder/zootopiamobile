name: Doku indir (Poly Haven CC0)

on:
  workflow_dispatch:
    inputs:
      cozunurluk:
        description: 'Doku çözünürlüğü (1k, 2k, 4k)'
        default: '2k'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download textures
        env:
          TEX_RES: ${{ github.event.inputs.cozunurluk || '2k' }}
        run: python Tools/fetch_textures.py
      - name: Commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Resources/Textures
          git commit -m "Textures from Poly Haven (CC0) [skip ci]" || echo "no changes"
          git push
